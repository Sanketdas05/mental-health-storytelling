<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lhSkin" x1="100%" y1="0%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="35%" stop-color="#f8efe4" />
      <stop offset="75%" stop-color="#eddac6" />
      <stop offset="100%" stop-color="#dec6ae" />
    </linearGradient>
    <linearGradient id="lhInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a12" />
      <stop offset="100%" stop-color="#3d2a1d" />
    </linearGradient>
    <filter id="lhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#e0913c" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#lhGlow)">
    <!-- Arm and Wrist entering from upper-right -->
    <path
      d="M 520,10
         C 470,55 420,100 370,140
         C 358,148 344,154 330,160
         C 318,156 305,158 295,165
         C 282,162 270,166 260,175
         C 248,174 236,180 226,188
         C 208,194 175,218 135,252
         C 105,278 74,310 54,335
         C 47,343 48,349 56,350
         C 64,350 76,341 96,322
         C 125,294 158,267 178,252
         C 194,258 208,258 222,250
         C 234,264 250,270 264,265
         C 278,260 288,248 294,234
         C 312,230 330,218 344,202
         C 364,180 390,165 420,155
         C 452,145 490,135 520,132
         Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Curled Pinky -->
    <path
      d="M 302,162 C 284,150 266,148 255,156 C 246,163 249,173 262,178 C 276,184 294,175 302,162 Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.2"
    />

    <!-- Curled Ring Finger -->
    <path
      d="M 270,172 C 248,162 227,161 214,170 C 206,177 210,188 226,193 C 244,198 261,188 270,172 Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.2"
    />

    <!-- Gently Curved Middle Finger -->
    <path
      d="M 230,190 C 203,181 172,184 149,198 C 138,206 142,217 160,222 C 187,228 216,217 230,190 Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.2"
    />

    <!-- Thumb (Tucked & Relaxed) -->
    <path
      d="M 344,202 C 325,225 302,242 275,248 C 260,252 253,242 262,231 C 275,216 296,197 316,184 C 329,175 339,186 344,202 Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.2"
    />

    <!-- Reaching Index Finger (Fingertip at 50, 335) -->
    <path
      d="M 214,226
         C 186,251 148,282 106,315
         C 81,334 60,350 52,347
         C 46,344 48,335 59,323
         C 86,294 126,262 163,232
         C 182,218 200,212 214,226 Z"
      fill="url(#lhSkin)"
      stroke="url(#lhInk)"
      stroke-width="1.4"
      stroke-linejoin="round"
    />

    <!-- Delicate Anatomical Hatch Lines -->
    <path d="M 450,140 C 395,162 340,188 286,216" fill="none" stroke="#241a12" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4,4" />
    <path d="M 425,125 C 375,146 322,170 270,196" fill="none" stroke="#241a12" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3,4" />
    <path d="M 400,110 C 355,130 308,150 262,166" fill="none" stroke="#241a12" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="2,4" />

    <!-- Knuckle and Joint Creases -->
    <path d="M 220,220 C 213,226 205,231 199,229" fill="none" stroke="#241a12" stroke-opacity="0.55" stroke-width="1.3" />
    <path d="M 162,264 C 155,270 147,274 141,272" fill="none" stroke="#241a12" stroke-opacity="0.55" stroke-width="1.3" />
    <path d="M 105,306 C 98,312 90,316 85,313" fill="none" stroke="#241a12" stroke-opacity="0.55" stroke-width="1.3" />

    <!-- Index Fingertip Warm Bloom Highlight -->
    <circle cx="50" cy="335" r="3.5" fill="#f8d090" opacity="0.9" />
  </g>
</svg>