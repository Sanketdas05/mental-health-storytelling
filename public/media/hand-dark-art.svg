<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dhSkin" x1="0%" y1="100%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#120c08" />
      <stop offset="40%" stop-color="#1a120c" />
      <stop offset="75%" stop-color="#261a12" />
      <stop offset="100%" stop-color="#36251a" />
    </linearGradient>
    <linearGradient id="dhHatch" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0913c" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#e0913c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f8be72" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dhShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#dhShadow)">
    <!-- Arm and Wrist entering from lower-left -->
    <path
      d="M -20,390
         C 30,345 80,300 130,260
         C 142,252 156,246 170,240
         C 182,244 195,242 205,235
         C 218,238 230,234 240,225
         C 252,226 264,220 274,212
         C 292,206 325,182 365,148
         C 395,122 426,90 446,65
         C 453,57 452,51 444,50
         C 436,50 424,59 404,78
         C 375,106 342,133 322,148
         C 306,142 292,142 278,150
         C 266,136 250,130 236,135
         C 222,140 212,152 206,166
         C 188,170 170,182 156,198
         C 136,220 110,235 80,245
         C 48,255 10,265 -20,268
         Z"
      fill="url(#dhSkin)"
      stroke="#0d0906"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Curled Pinky -->
    <path
      d="M 198,238 C 216,250 234,252 245,244 C 254,237 251,227 238,222 C 224,216 206,225 198,238 Z"
      fill="url(#dhSkin)"
      stroke="url(#dhHatch)"
      stroke-width="1.2"
    />

    <!-- Curled Ring Finger -->
    <path
      d="M 230,228 C 252,238 273,239 286,230 C 294,223 290,212 274,207 C 256,202 239,212 230,228 Z"
      fill="url(#dhSkin)"
      stroke="url(#dhHatch)"
      stroke-width="1.2"
    />

    <!-- Gently Curved Middle Finger -->
    <path
      d="M 270,210 C 297,219 328,216 351,202 C 362,194 358,183 340,178 C 313,172 284,183 270,210 Z"
      fill="url(#dhSkin)"
      stroke="url(#dhHatch)"
      stroke-width="1.2"
    />

    <!-- Thumb (Forward and Relaxed) -->
    <path
      d="M 156,198 C 175,175 198,158 225,152 C 240,148 247,158 238,169 C 225,184 204,203 184,216 C 171,225 161,214 156,198 Z"
      fill="url(#dhSkin)"
      stroke="url(#dhHatch)"
      stroke-width="1.2"
    />

    <!-- Outstretched Index Finger (Fingertip at 450, 65) -->
    <path
      d="M 286,174
         C 314,149 352,118 394,85
         C 419,66 440,50 448,53
         C 454,56 452,65 441,77
         C 414,106 374,138 337,168
         C 318,182 300,188 286,174 Z"
      fill="url(#dhSkin)"
      stroke="url(#dhHatch)"
      stroke-width="1.4"
      stroke-linejoin="round"
    />

    <!-- Intaglio Hatching Lines on Tendons & Joints -->
    <path d="M 50,260 C 105,238 160,212 214,184" fill="none" stroke="url(#dhHatch)" stroke-width="1.2" stroke-dasharray="4,4" />
    <path d="M 75,275 C 125,254 178,230 230,204" fill="none" stroke="url(#dhHatch)" stroke-width="1" stroke-dasharray="3,4" />
    <path d="M 100,290 C 145,270 192,250 238,234" fill="none" stroke="url(#dhHatch)" stroke-width="0.8" stroke-dasharray="2,4" />

    <!-- Knuckle and Joint Creases -->
    <path d="M 280,180 C 287,174 295,169 301,171" fill="none" stroke="url(#dhHatch)" stroke-width="1.3" />
    <path d="M 338,136 C 345,130 353,126 359,128" fill="none" stroke="url(#dhHatch)" stroke-width="1.3" />
    <path d="M 395,94 C 402,88 410,84 415,87" fill="none" stroke="url(#dhHatch)" stroke-width="1.3" />

    <!-- Index Fingertip Warm Spark -->
    <circle cx="450" cy="65" r="3.5" fill="#f8d090" opacity="0.9" />
  </g>
</svg>